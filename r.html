<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<title>Brew Pilot Recipe</title>

<!-- Static OpenGraph / Twitter Card. Per-recipe metadata isn't possible
     from a static page; if dynamic previews matter later, we can add a
     Cloudflare Worker that decodes ?d=… server-side and rewrites these. -->
<meta property="og:title" content="A homebrew recipe shared via Brew Pilot">
<meta property="og:description" content="Tap to import this recipe in Brew Pilot, or preview it here.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Brew Pilot">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Brew Pilot Recipe">
<meta name="twitter:description" content="Tap to import this recipe in Brew Pilot.">

<!-- Apple Smart App Banner — shows a "VIEW" button at the top of Safari
     when this page loads, which drops the user straight into the App Store
     listing if they don't have the app. Replace 6761862460 with the real
     App Store ID once published. -->
<meta name="apple-itunes-app" content="app-id=6761862460">

<style>
  :root {
    --bp-bg: #0F0F12;
    --bp-surface: #16161A;
    --bp-surface-2: #1E1E24;
    --bp-text: #F2F2F2;
    --bp-text-dim: #9A9AA1;
    --bp-gold: #D4A547;
    --bp-gold-dim: rgba(212, 165, 71, 0.35);
    --bp-divider: rgba(255, 255, 255, 0.08);
    --bp-radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bp-bg);
    color: var(--bp-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  header.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 0;
    color: var(--bp-text-dim);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  header.brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bp-gold);
    box-shadow: 0 0 0 4px var(--bp-gold-dim);
  }
  h1.recipe-name {
    font-size: 30px;
    line-height: 1.2;
    margin: 8px 0 6px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .style {
    color: var(--bp-text-dim);
    font-size: 16px;
    margin-bottom: 24px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--bp-surface);
    border-radius: var(--bp-radius);
    padding: 16px;
    margin-bottom: 20px;
  }
  .stat {
    text-align: center;
  }
  .stat .v {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .stat .l {
    font-size: 11px;
    color: var(--bp-text-dim);
    margin-top: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .ctas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 8px 0 24px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 20px;
    border-radius: var(--bp-radius);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: opacity 0.15s ease;
    border: none;
    cursor: pointer;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary {
    background: var(--bp-gold);
    color: #1A1305;
  }
  .btn-secondary {
    background: var(--bp-surface-2);
    color: var(--bp-text);
    border: 1px solid var(--bp-divider);
  }
  section.card {
    background: var(--bp-surface);
    border-radius: var(--bp-radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  section.card h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bp-text-dim);
  }
  table.ingredients {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.ingredients th,
  table.ingredients td {
    text-align: left;
    padding: 8px 0;
    border-bottom: 1px solid var(--bp-divider);
  }
  table.ingredients th {
    font-weight: 500;
    color: var(--bp-text-dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  table.ingredients td.amount {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--bp-text-dim);
    white-space: nowrap;
  }
  table.ingredients tr:last-child td { border-bottom: none; }
  .notes {
    font-size: 14px;
    line-height: 1.55;
    color: var(--bp-text);
    white-space: pre-wrap;
  }
  .water-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 8px;
    font-size: 13px;
  }
  .water-grid .ion {
    color: var(--bp-text-dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .water-grid .val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  footer {
    color: var(--bp-text-dim);
    font-size: 12px;
    text-align: center;
    padding: 32px 0;
    line-height: 1.6;
  }
  footer a { color: var(--bp-gold); text-decoration: none; }
  .error {
    background: var(--bp-surface);
    border-radius: var(--bp-radius);
    padding: 24px;
    text-align: center;
    color: var(--bp-text-dim);
  }
  .error h2 {
    color: var(--bp-text);
    margin: 0 0 8px;
    font-size: 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <span class="dot"></span>
    <span>Brew Pilot</span>
  </header>

  <main id="main">
    <p class="style">Loading recipe…</p>
  </main>

  <footer>
    Recipe shared via Brew Pilot for iOS.<br>
    <a id="footer-app-link" href="https://apps.apple.com/app/id6761862460">Get the app on the App Store</a>
  </footer>
</div>

<script>
"use strict";

// ------- Decoder -------
// Mirror of Brew Pilot's iOS RecipeURLCodec:
//   1. Read ?d=… (URL-safe base64, no padding)
//   2. Convert to standard base64, add padding, decode to bytes
//   3. Inflate with DecompressionStream('deflate-raw') (matches iOS COMPRESSION_ZLIB)
//   4. JSON-parse
async function decodeRecipeFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get("d");
  if (!d) throw new Error("No recipe data in URL.");

  // URL-safe base64 -> standard base64
  let b64 = d.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";

  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser is too old to decode the link. Open it on a recent iOS / Safari / Chrome.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  const decompressed = await new Response(stream).arrayBuffer();
  const json = new TextDecoder().decode(decompressed);
  return JSON.parse(json);
}

// ------- Rendering -------
function escape(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmt(n, dp) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toFixed(dp);
}
function abv(og, fg) {
  if (!og || !fg) return null;
  return ((og - fg) * 131.25).toFixed(1);
}
function estimateFG(og, attenuation) {
  if (!og) return null;
  const att = attenuation != null ? attenuation : 75;
  return 1 + (og - 1) * (1 - att / 100);
}

function renderRecipe(r) {
  const main = document.getElementById("main");
  const dParam = new URLSearchParams(window.location.search).get("d");
  const deepLink = `brewpilot://recipe?d=${dParam}`;

  // Header + stats
  const og = r.targetOG;
  const att = r.yeastOptions?.[0]?.attenuation;
  const fg = estimateFG(og, att);
  const abvVal = abv(og, fg);

  let html = `
    <h1 class="recipe-name">${escape(r.name || "Untitled Recipe")}</h1>
    ${r.style ? `<p class="style">${escape(r.style)}</p>` : ""}

    <div class="stats">
      <div class="stat"><div class="v">${fmt(og, 3)}</div><div class="l">OG</div></div>
      <div class="stat"><div class="v">${abvVal ?? "—"}${abvVal ? "%" : ""}</div><div class="l">ABV</div></div>
      <div class="stat"><div class="v">${Math.round(r.targetIBU || 0)}</div><div class="l">IBU</div></div>
    </div>

    <div class="ctas">
      <a class="btn btn-primary" href="${deepLink}">Open in Brew Pilot</a>
      <a class="btn btn-secondary" href="https://apps.apple.com/app/id6761862460">Get Brew Pilot on the App Store</a>
    </div>
  `;

  // Grain bill
  if (r.grainBill?.length) {
    html += `
      <section class="card">
        <h2>Grain Bill</h2>
        <table class="ingredients">
          <tbody>
          ${r.grainBill.map(g => `
            <tr>
              <td>${escape(g.name)}</td>
              <td class="amount">${fmt(g.amountLb, 2)} lb</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </section>`;
  }

  // Hops
  if (r.hopSchedule?.length) {
    html += `
      <section class="card">
        <h2>Hop Schedule</h2>
        <table class="ingredients">
          <thead>
            <tr><th>Hop</th><th>Amount</th><th class="amount">Time</th></tr>
          </thead>
          <tbody>
          ${r.hopSchedule.map(h => {
            const kind = ({ boil: "min boil", whirlpool: "WP", dryhop: "dry hop" })[h.type] || "";
            const time = h.timeMinutes != null ? `${h.timeMinutes} ${kind}` : kind;
            return `
              <tr>
                <td>${escape(h.name)}</td>
                <td>${fmt(h.amountOz, 2)} oz · ${fmt(h.alphaAcid, 1)}% AA</td>
                <td class="amount">${escape(time.trim())}</td>
              </tr>`;
          }).join("")}
          </tbody>
        </table>
      </section>`;
  }

  // Yeast
  if (r.yeastOptions?.length) {
    html += `
      <section class="card">
        <h2>Yeast</h2>
        <table class="ingredients">
          <tbody>
          ${r.yeastOptions.map(y => `
            <tr>
              <td>${escape(y.name)}${y.lab ? ` <span style="color:var(--bp-text-dim)">· ${escape(y.lab)}</span>` : ""}</td>
              <td class="amount">${y.attenuation ? `${y.attenuation}% att` : ""}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </section>`;
  }

  // Water profile
  if (r.waterProfile && r.useWaterProfile !== false) {
    const w = r.waterProfile;
    html += `
      <section class="card">
        <h2>Water Profile${w.name ? ` · ${escape(w.name)}` : ""}</h2>
        <div class="water-grid">
          <div><div class="val">${Math.round(w.calcium || 0)}</div><div class="ion">Ca²⁺</div></div>
          <div><div class="val">${Math.round(w.magnesium || 0)}</div><div class="ion">Mg²⁺</div></div>
          <div><div class="val">${Math.round(w.sodium || 0)}</div><div class="ion">Na⁺</div></div>
          <div><div class="val">${Math.round(w.sulfate || 0)}</div><div class="ion">SO₄²⁻</div></div>
          <div><div class="val">${Math.round(w.chloride || 0)}</div><div class="ion">Cl⁻</div></div>
          <div><div class="val">${Math.round(w.bicarbonate || 0)}</div><div class="ion">HCO₃⁻</div></div>
        </div>
      </section>`;
  }

  // Notes
  if (r.notes && r.notes.trim()) {
    html += `
      <section class="card">
        <h2>Notes</h2>
        <div class="notes">${escape(r.notes)}</div>
      </section>`;
  }

  main.innerHTML = html;
  document.title = `${r.name || "Recipe"} · Brew Pilot`;
}

function renderError(message) {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="error">
      <h2>Couldn't load recipe</h2>
      <p>${escape(message)}</p>
      <p style="margin-top:18px;">
        <a class="btn btn-secondary" href="https://apps.apple.com/app/id6761862460" style="display:inline-flex;">
          Get Brew Pilot
        </a>
      </p>
    </div>`;
}

// ------- Bootstrap -------
decodeRecipeFromQuery()
  .then(renderRecipe)
  .catch(err => {
    console.error(err);
    renderError(err.message || "The shared link looks corrupted.");
  });
</script>
</body>
</html>
